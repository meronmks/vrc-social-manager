name: 'release-pr'

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: バージョンを検証してタグを作成
        id: release
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          VERSION="${BRANCH_NAME#release/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "エラー: 不正なバージョン形式です: $VERSION"
            exit 1
          fi

          CONFIG_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "$VERSION" != "$CONFIG_VERSION" ]; then
            echo "エラー: リリースブランチと tauri.conf.json のバージョンが一致しません"
            echo "ブランチ: $VERSION"
            echo "tauri.conf.json: $CONFIG_VERSION"
            exit 1
          fi

          TAG_NAME="v$VERSION"
          TARGET_COMMIT=$(git rev-parse HEAD)
          EXISTING_COMMIT=$(git rev-list -n 1 "$TAG_NAME" 2>/dev/null || true)

          if [ -n "$EXISTING_COMMIT" ]; then
            if [ "$EXISTING_COMMIT" != "$TARGET_COMMIT" ]; then
              echo "エラー: $TAG_NAME は別のコミットを指しています"
              echo "既存タグ: $EXISTING_COMMIT"
              echo "対象: $TARGET_COMMIT"
              exit 1
            fi
            echo "$TAG_NAME は対象コミットに作成済みです"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
            echo "$TAG_NAME を作成しました"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.prepare.outputs.tag_name }}
    secrets: inherit

  cleanup:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - name: リリースブランチを削除してPRへ通知
        uses: actions/github-script@v8
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchRef = `heads/${process.env.BRANCH_NAME}`;

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: branchRef,
              });
              core.info(`リリースブランチ ${process.env.BRANCH_NAME} を削除しました`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info('リリースブランチは既に削除されています');
            }

            const body = [
              '🚀 **リリース処理が完了しました**',
              '',
              `- タグ: \`${process.env.TAG_NAME}\``,
              '- ドラフトリリースを作成しました',
              `- [Releases](${context.payload.repository.html_url}/releases) で確認・公開できます`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
