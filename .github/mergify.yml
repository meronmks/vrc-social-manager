queue_rules:
  - name: dep-update
    batch_size: 10
    batch_max_wait_time: 30 min
    queue_conditions:
      - author=dependabot[bot]
    merge_conditions:
      - check-success=frontend-check
      - check-success=rust-check (ubuntu-22.04)
      - check-success=rust-check (windows-latest)
      - check-success=rust-check (macos-latest)
      - check-success=tauri-build

pull_request_rules:
  - name: Auto merge - Dependabot
    conditions:
      - author=dependabot[bot]
      - or:
          - and:
              - -head ~= ^dependabot/(npm_and_yarn|cargo)/(.*/)?(npm-security|cargo-security|group-security-(npm_and_yarn|cargo))-[0-9a-f]{10}$
              - dependabot-update-type ~= ^version-update:semver-(minor|patch)$
          - and:
              # パッチ判定は Dependabot が作成した先頭コミットを使う。
              - base = main
              - "#commits = 1"
              - -files ~= ^\.github/
              - check-success = @github-actions/dependabot-patch
      - check-success=frontend-check
      - check-success=rust-check (ubuntu-22.04)
      - check-success=rust-check (windows-latest)
      - check-success=rust-check (macos-latest)
      - check-success=tauri-build
    actions:
      queue:
        name: dep-update
merge_protections_settings:
  reporting_method: check-runs
